<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOJO MANHAL INTERNATIONAL | سوجو منهل الدولية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#E8F1FF;--card:#fff;--tx:#0D3B66;--mu:#5b7391;--ac:#1E5AA8;--gd:#3B82F6;--bd:#d3e2f6}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth}
body{font-family:Cairo,Montserrat,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7}
a{color:inherit;text-decoration:none}
.w{max-width:1180px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.logo{display:flex;align-items:center}#lt{display:none}#lg{display:flex;align-items:center;gap:10px;font-family:Montserrat,Cairo,sans-serif;font-weight:800;font-size:19px;color:#0D3B66;line-height:1.1}#lg img{height:44px}#lg i{font-style:normal;font-weight:300;margin:0 7px;opacity:.45}#lg small{display:block;font-size:9px;letter-spacing:3px;font-weight:600;color:#5b7391}
nav{display:flex;gap:22px;font-size:15px;color:var(--mu)}nav a:hover{color:var(--ac)}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:600;padding:10px 22px;border-radius:10px;background:var(--ac);color:#fff}
.btn.o{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.g{background:#0D3B66;color:#fff}.btn.s{padding:5px 12px;font-size:13px}.btn.r{background:#c0392b;color:#fff}
.hero{padding:70px 0;background:linear-gradient(135deg,#0D3B66,#1E5AA8);color:#fff}.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}.hi{width:100%;max-width:520px;border-radius:22px;box-shadow:0 20px 60px #0006;justify-self:center}.tg{font:600 12px Montserrat,sans-serif;letter-spacing:3px;color:#93C5FD;margin-bottom:12px}.hero h1{font-size:clamp(28px,4.4vw,46px);line-height:1.3;font-weight:800}.hero h1 span{color:#93C5FD}.hero p{color:#d6e5f8;max-width:560px;margin:18px 0 28px;font-size:17px}.hero .btn{background:#fff;color:#0D3B66}.hero .btn.o{background:transparent;border:1px solid #93C5FD;color:#fff}@media(max-width:800px){.hg{grid-template-columns:1fr}}
.stats{display:flex;gap:34px;margin-top:46px;flex-wrap:wrap}.stats div b{display:block;font-size:30px;color:#93C5FD}.stats div{color:#d6e5f8;font-size:14px}
section{padding:64px 0}.alt{background:var(--bg2)}
h2{font-size:30px;margin-bottom:8px}.sub{color:var(--mu);margin-bottom:30px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.chip{padding:7px 18px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--mu);cursor:pointer;font:inherit}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,textarea,select{font:inherit;background:#f5f9ff;color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;width:100%}
.tools input{max-width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--card);box-shadow:0 4px 18px #0d3b6612;border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:var(--ac)}
.ph{height:170px;background:linear-gradient(135deg,#E8F1FF,#93C5FD);display:flex;align-items:center;justify-content:center;font-size:54px;background-size:cover;background-position:center}
.card .b{padding:16px}.card h3{font-size:18px}.tag{font-size:12px;color:var(--gd)}.card p{color:var(--mu);font-size:14px;margin-top:6px}
.f3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px}.box i{font-style:normal;font-size:30px}.box h3{margin:8px 0 4px;font-size:18px}.box p{color:var(--mu);font-size:14px}
.mk{display:flex;flex-wrap:wrap;gap:10px}.mk span{padding:8px 18px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:30px}@media(max-width:800px){.ct{grid-template-columns:1fr}nav{display:none}}
.ct form{display:grid;gap:10px}
.soc{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.soc a{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:20px}.soc a:hover{border-color:var(--ac)}
footer{background:#0D3B66;padding:26px 0;color:#cfe0f5;font-size:14px}.fl{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.fab{position:fixed;bottom:20px;inset-inline-start:20px;width:56px;height:56px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:30;box-shadow:0 6px 20px #0008}
.ov{position:fixed;inset:0;background:#06213fcc;z-index:50;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px}.ov.on{display:flex}
.md{background:#fff;border:1px solid var(--bd);border-radius:18px;width:100%;max-width:720px;padding:24px;position:relative}
.md.big{max-width:980px}.x{position:absolute;top:12px;inset-inline-end:14px;background:none;border:0;color:var(--mu);font-size:26px;cursor:pointer}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:var(--card)}
.sp{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 22px;border-radius:10px;z-index:99;display:none;font-weight:600}
</style>
</head>
